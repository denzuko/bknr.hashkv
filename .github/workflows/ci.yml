name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: bknr.hashkv
      - uses: actions/checkout@v4
        with:
          repository: denzuko/bknr.ttl
          ref: develop
          path: bknr.ttl
      - uses: actions/checkout@v4
        with:
          repository: denzuko/sunny-side
          ref: develop
          path: sunny-side

      - name: Install Roswell, sbcl-bin, qlot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libacl1-dev libcap-dev sudo python3
          which ros || (curl -sL https://github.com/roswell/roswell/releases/download/v23.10.14.114/roswell_23.10.14.114-1_amd64.deb -o /tmp/roswell.deb && sudo dpkg -i /tmp/roswell.deb)
          ros install sbcl-bin
          ros install qlot
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Link sibling dependencies into Quicklisp local-projects
        run: |
          mkdir -p ~/.roswell/lisp/quicklisp/local-projects
          ln -s "$GITHUB_WORKSPACE/bknr.ttl" ~/.roswell/lisp/quicklisp/local-projects/bknr.ttl
          ln -s "$GITHUB_WORKSPACE/sunny-side" ~/.roswell/lisp/quicklisp/local-projects/sunny-side

      - name: Run unit suite
        working-directory: bknr.hashkv
        run: ros -e '(ql:quickload :bknr.hashkv/tests :verbose nil)' -e '(uiop:quit (if (bknr.hashkv/tests:run-tests) 0 1))'

  e2e-tests:
    runs-on: ubuntu-latest
    # KNOWN, TRACKED FAILURE: denzuko/bknr.hashkv#1. Restored objects
    # are found correctly via BKNR.DATASTORE:CLASS-INSTANCES, but
    # their unique-index readers (ENTRY-WITH-KEY, ENTRY-WITH-JOB-ID)
    # return NIL after a close/reopen cycle until something else
    # touches the index. This job is expected to fail on exactly one
    # test (ENTRIES-SURVIVE-A-STORE-RESTART) until that's resolved.
    # See the issue rather than treating this red status as a
    # surprise or masking it.
    steps:
      - uses: actions/checkout@v4
        with:
          path: bknr.hashkv
      - uses: actions/checkout@v4
        with:
          repository: denzuko/bknr.ttl
          ref: develop
          path: bknr.ttl
      - uses: actions/checkout@v4
        with:
          repository: denzuko/sunny-side
          ref: develop
          path: sunny-side

      - name: Install Roswell, sbcl-bin, qlot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libacl1-dev libcap-dev sudo python3
          which ros || (curl -sL https://github.com/roswell/roswell/releases/download/v23.10.14.114/roswell_23.10.14.114-1_amd64.deb -o /tmp/roswell.deb && sudo dpkg -i /tmp/roswell.deb)
          ros install sbcl-bin
          ros install qlot
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Link sibling dependencies into Quicklisp local-projects
        run: |
          mkdir -p ~/.roswell/lisp/quicklisp/local-projects
          ln -s "$GITHUB_WORKSPACE/bknr.ttl" ~/.roswell/lisp/quicklisp/local-projects/bknr.ttl
          ln -s "$GITHUB_WORKSPACE/sunny-side" ~/.roswell/lisp/quicklisp/local-projects/sunny-side

      - name: Run e2e suite (see denzuko/bknr.hashkv#1 for the one known failure)
        working-directory: bknr.hashkv
        run: ros -e '(ql:quickload :bknr.hashkv/e2e :verbose nil)' -e '(uiop:quit (if (bknr.hashkv/e2e:run-e2e) 0 1))'

  bdd-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: bknr.hashkv
      - uses: actions/checkout@v4
        with:
          repository: denzuko/bknr.ttl
          ref: develop
          path: bknr.ttl
      - uses: actions/checkout@v4
        with:
          repository: denzuko/sunny-side
          ref: develop
          path: sunny-side

      - name: Install Roswell, sbcl-bin, qlot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libacl1-dev libcap-dev sudo python3
          which ros || (curl -sL https://github.com/roswell/roswell/releases/download/v23.10.14.114/roswell_23.10.14.114-1_amd64.deb -o /tmp/roswell.deb && sudo dpkg -i /tmp/roswell.deb)
          ros install sbcl-bin
          ros install qlot
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Link sibling dependencies into Quicklisp local-projects
        run: |
          mkdir -p ~/.roswell/lisp/quicklisp/local-projects
          ln -s "$GITHUB_WORKSPACE/bknr.ttl" ~/.roswell/lisp/quicklisp/local-projects/bknr.ttl
          ln -s "$GITHUB_WORKSPACE/sunny-side" ~/.roswell/lisp/quicklisp/local-projects/sunny-side

      - name: Run BDD suite
        working-directory: bknr.hashkv
        run: ros -e '(ql:quickload :bknr.hashkv/bdd :verbose nil)' -e '(uiop:quit (if (bknr.hashkv/bdd:run-bdd) 0 1))'

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: bknr.hashkv
      - uses: actions/checkout@v4
        with:
          repository: denzuko/bknr.ttl
          ref: develop
          path: bknr.ttl
      - uses: actions/checkout@v4
        with:
          repository: denzuko/sunny-side
          ref: develop
          path: sunny-side

      - name: Install Roswell, sbcl-bin, qlot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libacl1-dev libcap-dev sudo python3
          which ros || (curl -sL https://github.com/roswell/roswell/releases/download/v23.10.14.114/roswell_23.10.14.114-1_amd64.deb -o /tmp/roswell.deb && sudo dpkg -i /tmp/roswell.deb)
          ros install sbcl-bin
          ros install qlot
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Link sibling dependencies into Quicklisp local-projects
        run: |
          mkdir -p ~/.roswell/lisp/quicklisp/local-projects
          ln -s "$GITHUB_WORKSPACE/bknr.ttl" ~/.roswell/lisp/quicklisp/local-projects/bknr.ttl
          ln -s "$GITHUB_WORKSPACE/sunny-side" ~/.roswell/lisp/quicklisp/local-projects/sunny-side

      - name: Confirm the manual renders
        working-directory: bknr.hashkv
        run: ros -e '(ql:quickload :bknr.hashkv/docs :verbose nil)' -e '(bknr.hashkv/docs:generate)' -e '(uiop:quit 0)'
